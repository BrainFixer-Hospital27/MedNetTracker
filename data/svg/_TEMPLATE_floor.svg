<?xml version="1.0" encoding="UTF-8"?>
<!--
  ОБРАЗЕЦ ПОЭТАЖНОГО ПЛАНА ДЛЯ MEDNET TRACKER
  ============================================
  Система координат: 1 единица SVG = 1 сантиметр реального здания.
  Фрагмент 2-го этажа: помещения 7-11 (нижний ряд), коридор, 51-53 (верхний ряд).

  Приложению обязательны ровно три вещи:
    1. атрибут viewBox на корневом <svg>;
    2. группа с id="layer-rooms";
    3. внутри неё - замкнутые фигуры с id вида "room-XXX".
  Всё остальное - стены, размеры, подложка - рисуйте как удобно.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2100 1400"
     width="2100" height="1400">

  <!-- ================================================================
       СЛОЙ 1: ПОДЛОЖКА (необязательный)
       Сюда кладётся отсканированный план, если вы не хотите
       перечерчивать стены. Растр выравнивается и масштабируется
       так, чтобы совпасть с полигонами помещений.
       ================================================================ -->
  <g id="layer-scan" pointer-events="none" opacity="0.35">
    <!-- <image x="0" y="0" width="2100" height="1400"
              xlink:href="data:image/jpeg;base64,..." /> -->
  </g>

  <!-- ================================================================
       СЛОЙ 2: ГРАФИКА ПЛАНА (необязательный)
       Стены, двери, размерные линии, лестницы. Не интерактивен.
       ================================================================ -->
  <g id="layer-base" pointer-events="none"
     fill="none" stroke="#2b3440" stroke-width="14" stroke-linejoin="miter">
    <path d="M 0 60 H 1700 V 560 H 2020 V 1306 H 0 Z" />
    <path d="M 0 560 H 2020" />
    <path d="M 0 800 H 2020" />
  </g>

  <!-- ================================================================
       СЛОЙ 3: ПОМЕЩЕНИЯ - единственный слой, который читает система
       Заливку не задавайте: цвет назначает приложение по отделению.
       ================================================================ -->
  <g id="layer-rooms">

    <!-- Нижний ряд, глубина 506 см -->
    <path id="room-7"  class="room" d="M 0    800 H 370  V 1306 H 0    Z" />
    <path id="room-8"  class="room" d="M 370  800 H 680  V 1306 H 370  Z" />
    <path id="room-9"  class="room" d="M 680  800 H 1012 V 1306 H 680  Z" />
    <path id="room-10" class="room" d="M 1012 800 H 1334 V 1306 H 1012 Z" />
    <path id="room-11" class="room" d="M 1334 800 H 2020 V 1306 H 1334 Z" />

    <!-- Коридор - такое же помещение, просто с буквенным номером -->
    <path id="room-kor-1" class="room" d="M 0 560 H 2020 V 800 H 0 Z" />

    <!-- Верхний ряд, глубина 500 см -->
    <path id="room-53" class="room" d="M 0   60 H 484  V 560 H 0   Z" />
    <path id="room-52" class="room" d="M 484 60 H 654  V 560 H 484 Z" />

    <!-- Пример Г-образного помещения: углов больше четырёх, ничего не меняется -->
    <path id="room-51" class="room" d="M 654 60 H 1100 V 300 H 852 V 560 H 654 Z" />
  </g>
</svg>
